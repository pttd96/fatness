name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

concurrency:
  group: deploy-migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry Run & Validate Migrations
    runs-on: ubuntu-latest
    outputs:
      has_pending: ${{ steps.check_migrations.outputs.has_pending }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify Required Secrets and Variables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          MISSING=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret 'SUPABASE_ACCESS_TOKEN' is missing. Please add it under GitHub Settings > Secrets and variables > Actions > Secrets."
            MISSING=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret 'SUPABASE_DB_PASSWORD' is missing. Please add it under GitHub Settings > Secrets and variables > Actions > Secrets."
            MISSING=1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Variable 'SUPABASE_PROJECT_ID' is missing. Please add it under GitHub Settings > Secrets and variables > Actions > Variables."
            MISSING=1
          fi
          if [ $MISSING -eq 1 ]; then
            exit 1
          fi

      - name: Link Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          echo "Linking Supabase project: $PROJECT_ID"
          supabase link --project-ref "$PROJECT_ID"

      - name: Check Pending Migrations (Dry Run)
        id: check_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Executing dry-run against remote database..."
          set +e
          DRY_RUN_OUTPUT=$(supabase db push --remote --dry-run 2>&1)
          DRY_RUN_EXIT=$?
          set -e

          echo "$DRY_RUN_OUTPUT"

          if [ $DRY_RUN_EXIT -ne 0 ]; then
            echo "::error::Migration dry-run failed with exit code $DRY_RUN_EXIT"
            exit $DRY_RUN_EXIT
          fi

          if echo "$DRY_RUN_OUTPUT" | grep -qiE "up to date|no migrations"; then
            echo "Remote database is already up to date. No pending migrations."
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "Pending migrations detected ready to be applied."
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Apply Database Migrations
    needs: dry-run
    if: github.event_name != 'pull_request' && needs.dry-run.outputs.has_pending == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          echo "Linking Supabase project: $PROJECT_ID"
          supabase link --project-ref "$PROJECT_ID"

      - name: Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Applying migrations to remote database..."
          supabase db push --remote --yes
          echo "Migrations successfully applied!"
